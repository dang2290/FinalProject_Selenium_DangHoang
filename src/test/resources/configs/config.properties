# Cấu hình chung, KHÔNG chứa bí mật (file này lên git). Tài khoản, mật khẩu ở .env
# Ưu tiên: -Dkey > biến môi trường > .env > <TEST_ENV>.properties > file này
# Thêm môi trường: tạo configs/staging.properties chỉ gồm key khác biệt, chạy với -DTEST_ENV=staging

BASE_URL=https://cms.anhtester.com
BROWSER=chrome
HEADLESS=false
TIMEOUT=15

# Chụp ảnh sau MỖI thao tác của WebUI (chậm, chỉ bật khi dò lỗi). Ảnh cuối mỗi test thì luôn có.
SCREENSHOT_ALL_STEPS=false
